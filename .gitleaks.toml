# Varredura de segredos (SR-14; ADR-019 D6). Estende as regras padrão do gitleaks.
# A liberação é por VALOR EXATO de fixture falsa dos testes, nunca por caminho: um segredo real
# colado num arquivo de teste continua sendo pego. Valor novo aqui exige revisão do [APPSEC].

[extend]
useDefault = true

[[allowlists]]
description = "Fixtures falsas dos testes da API (tokens JWS montados à mão, chave secret fictícia e prefixo legado) e da extensão (canário de chave)"
regexes = [
  # JWS falsos: cabeçalho, carga de teste e assinatura "c2lnbmF0dXJh" / "b3V0cmE" / "canario-assinatura".
  '''^eyJhbGciOiJFUzI1NiJ9\.eyJzdWIiOiJhIn0\.c2lnbmF0dXJh$''',
  '''^eyJhbGciOiJFUzI1NiJ9\.eyJzdWIiOiJ0ZXN0ZSJ9\.c2lnbmF0dXJh$''',
  '''^eyJhbGciOiJFUzI1NiJ9\.eyJzdWIiOiJvdXRyYSJ9\.b3V0cmE$''',
  '''^eyJjYW5hcmlvIjoiaGVhZGVyIn0\.eyJjYW5hcmlvIjoic3ViIn0\.canario-assinatura$''',
  '''^eyJhbGciOiJIUzI1NiJ9\.eyJyb2xlIjoic2VydmljZV9yb2xlIn0\.assinatura$''',
  # Prefixo da chave legada e chaves secret fictícias que o boot e o cliente devem recusar.
  '''^eyJhbGciOiJIUzI1NiJ9$''',
  '''^sb_secret_AbC123-teste_xyz$''',
  '''^sb_secret_vazada-123$''',
  '''^6f0c2a4e-1b3d-4c5e-8f70-9a1b2c3d4e5f$''',
  # Canário da extensão (apps/extension/test/manifest.test.ts, commit cd141d2): base64 de "CANARIO-nao-e-chave", que o
  # build recusa como chave SPKI. Hoje o teste o monta em tempo de execução; a liberação cobre o histórico.
  '''^Q0FOQVJJTy1uYW8tZS1jaGF2ZQ==$''',
]

# Regras próprias (ADR-004 §4.8 e D9; emenda do 07h no ADR-019). O gitleaks não junta regex e caminho com "ou",
# então a regra trampo-auth-seal-keys tem duas partes com o mesmo prefixo. Nenhuma das duas tem allowlist própria,
# entropy nem secretGroup, e o @trampo/ci-policy (gitleaks-config.test.ts) prova as duas com casos positivos e
# negativos. Amostra de teste com chave é montada em tempo de execução, nunca liberada aqui.
[[rules]]
id = "trampo-auth-seal-keys"
description = "Anel do envelope do refresh (AUTH_REFRESH_SEAL_KEYS) com material de chave literal (32+ caracteres): dotenv, YAML (inclusive na linha de baixo), JSON, código e shell"
regex = '''AUTH_REFRESH_SEAL_KEYS["'`\]]{0,2}[ \t]*(?:=>|:=|=|:)\s*["'`]?[A-Za-z0-9_-]{1,32}:[A-Za-z0-9_+/-]{32,}'''
keywords = ["auth_refresh_seal_keys"]

[[rules]]
id = "trampo-auth-seal-keys-files"
description = "Arquivo de chave privada pelo caminho: qualquer .pem e o signing_keys.json do GoTrue local (gerado no job db, nunca versionado)"
path = '''(?i:\.pem$|(?:^|/)signing_keys\.json$)'''
